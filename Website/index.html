<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UGV Status Tab</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div id="header">
    <h1>UGV Status Tab</h1>
    <p>Here you can view the information sent by your <b>UGV (unnamed ground vehicle)</b></p>
  </div>
  <div id="panelGroup">
    <div class="panel glass-card">
      <div>
        <h2>Temperature</h2>
        <progress id="temp" value="50" min="0" max="100"></progress>
        <br>
        <span id="tempT">0 &deg;C</span>
      </div>
      <div>
        <h2>Humidity</h2>
        <progress id="humid" value="50" min="0" max="100"></progress>
        <br>
        <span id="humidT">0%</span>
      </div>
      <div>
        <h2>Pressure</h2>
        <progress id="press" value="50" min="0" max="100"></progress>
        <br>
        <span id="pressT">0 mPa</span>
      </div>
    </div>
    <div class="glass-card panel">
      <h2>Screen Canvas</h2>
      <canvas id="UltrasonicCanvas"></canvas>
    </div>
  </div>

  <div>
    <div id="buttons">
      <span id="W">W</span>
      <span id="A">A</span>
      <span id="S">S</span>
      <span id="D">D</span>
    </div>
  </div>

  <script src="script.js"></script>
</body>

</html>
